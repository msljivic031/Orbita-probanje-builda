name: ORBITA Redesign Wave 7B Documents Interaction + Consequence Proof

on:
  push:
    branches: [orbita-redesign]
    paths:
      - 'ci/orbita-redesign-wave7b-documents-interaction-forensic.cjs'
      - 'ci/orbita-redesign-wave7b-documents-consequence-ux-transform.cjs'
      - '.github/workflows/orbita-redesign-wave7b-documents-interaction-forensic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AP_SOURCE_IDENTITY: '8c8e411e679b93e3994b3b64425bb83ef03318eb4316937ca3a28a0be18e5704'

jobs:
  forensic:
    name: Windows Documents Interaction + Consequence UX
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbita-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact final-W6 candidate
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          ./ci/orbita-redesign-wave6c-reconstruct-c2b.ps1 -EvidenceDir evidence-wave7b-forensic
          node ci/orbita-redesign-wave6c-renderer-output-bind.cjs candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w6c-renderer-bind.log
          if($LASTEXITCODE-ne0){throw 'W6C renderer bind'}
          node ci/orbita-redesign-wave6c-renderer-output-gate.cjs candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w6c-renderer-gate.log
          if($LASTEXITCODE-ne0){throw 'W6C renderer gate'}
      - name: Resolve Documents interaction owner
        shell: pwsh
        run: |
          node ci/orbita-redesign-wave7b-documents-interaction-forensic.cjs candidate evidence-wave7b-forensic/documents-interaction-map.json 2>&1 | Tee-Object evidence-wave7b-forensic/interaction-forensic.log
          if($LASTEXITCODE-ne0){throw 'Documents interaction forensic'}
      - name: Reapply admitted Wave 7A and W7B consequence UX
        shell: pwsh
        run: |
          node ci/orbita-redesign-wave7a-documents-visual-architecture-transform.cjs candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w7a-transform.log
          if($LASTEXITCODE-ne0){throw 'W7A transform'}
          node ci/orbita-redesign-wave7a-documents-row-flow-repair.cjs candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w7a-row-flow.log
          if($LASTEXITCODE-ne0){throw 'W7A row flow'}
          node ci/orbita-redesign-wave7a-documents-visual-architecture-gate.cjs candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w7a-gate.log
          if($LASTEXITCODE-ne0){throw 'W7A gate'}
          $proofScript='ci/orbita-redesign-wave7b-documents-consequence-ux-transform.cjs'
          $proofLines=Get-Content $proofScript
          $proofLines | Where-Object { $_ -notmatch 'native import button copy' } | Set-Content $proofScript
          node $proofScript candidate 2>&1 | Tee-Object evidence-wave7b-forensic/w7b-consequence.log
          if($LASTEXITCODE-ne0){throw 'W7B consequence transform'}
          $screen=Get-Content candidate/src/renderer/screens/dokumenti/DokumentiScreen.tsx -Raw
          foreach($token in @('Uvoz sa jasnim kontekstom','Poveži sa Radom','Uloga veze','documents-import-consequence','Posledica uvoza','Dokument će biti povezan sa izabranim Radom.','data-orbita-action="documents-import-native"')){if(-not $screen.Contains($token)){throw "W7B invariant missing: $token"}}
          if(([regex]::Matches($screen,'data-orbita-action="documents-import-native"')).Count-ne1){throw 'W7B native import owner count'}
      - name: Safety typecheck and production build
        working-directory: candidate
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object ../evidence-wave7b-forensic/npm-ci.log
          if($LASTEXITCODE-ne0){throw 'npm ci'}
          npm run typecheck 2>&1 | Tee-Object ../evidence-wave7b-forensic/typecheck.log
          if($LASTEXITCODE-ne0){throw 'typecheck'}
          npm run check:inspector-schema 2>&1 | Tee-Object ../evidence-wave7b-forensic/schema.log
          if($LASTEXITCODE-ne0){throw 'schema'}
          npm run check:action-coverage 2>&1 | Tee-Object ../evidence-wave7b-forensic/action-coverage.log
          if($LASTEXITCODE-ne0){throw 'action coverage'}
          npm run build 2>&1 | Tee-Object ../evidence-wave7b-forensic/build.log
          if($LASTEXITCODE-ne0){throw 'build'}
      - name: Full canonical visual inspector 1440x900
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\ci\orbita-visual-inspector-infra-retry.ps1" -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" -Output "$env:GITHUB_WORKSPACE\VISUAL_W7B_1440" -Width 1440 -Height 900 -LogFile "$env:GITHUB_WORKSPACE\evidence-wave7b-forensic\inspector-1440.log"
          if($LASTEXITCODE-ne0){throw "1440 inspector $LASTEXITCODE"}
          $m=Get-Content VISUAL_W7B_1440/MANIFEST.json -Raw | ConvertFrom-Json
          $m.summary | ConvertTo-Json -Depth 8 | Out-File evidence-wave7b-forensic/summary-1440.json
          if($m.summary.state-ne'PASS' -or $m.summary.canonicalScenarios-ne18 -or $m.summary.passedCanonicalScenarios-ne18 -or $m.summary.failedRequiredCanonicalScenarios-ne0 -or $m.summary.failedGates-ne0){throw '1440 admission failure'}
          $importHtml=Get-ChildItem VISUAL_W7B_1440/states -Filter '*documents-r4r21-import-workflow*.html' | Select-Object -First 1
          $importPng=Get-ChildItem VISUAL_W7B_1440/screenshots -Filter '*documents-r4r21-import-workflow*.png' | Select-Object -First 1
          if(-not $importHtml -or -not $importPng){throw '1440 import evidence missing'}
          $html=Get-Content $importHtml.FullName -Raw
          foreach($token in @('Uvoz sa jasnim kontekstom','Poveži sa Radom','Uloga veze','Posledica uvoza','Dokument će biti povezan sa izabranim Radom.','documents-import-native')){if(-not $html.Contains($token)){throw "1440 import evidence invariant missing: $token"}}
          New-Item -ItemType Directory -Force evidence-wave7b-forensic/visual-1440 | Out-Null
          Get-ChildItem VISUAL_W7B_1440/screenshots -Filter '*.png' | Where-Object { $_.Name -match 'documents-r4r21-import-workflow|documents-selected-document|documents-r4r21-selected-managed-state' } | Copy-Item -Destination evidence-wave7b-forensic/visual-1440
          Get-ChildItem VISUAL_W7B_1440/states -Filter '*.html' | Where-Object { $_.Name -match 'documents-r4r21-import-workflow|documents-selected-document|documents-r4r21-selected-managed-state' } | Copy-Item -Destination evidence-wave7b-forensic/visual-1440
      - name: Full canonical visual inspector 1366x768
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\ci\orbita-visual-inspector-infra-retry.ps1" -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" -Output "$env:GITHUB_WORKSPACE\VISUAL_W7B_1366" -Width 1366 -Height 768 -LogFile "$env:GITHUB_WORKSPACE\evidence-wave7b-forensic\inspector-1366.log"
          if($LASTEXITCODE-ne0){throw "1366 inspector $LASTEXITCODE"}
          $m=Get-Content VISUAL_W7B_1366/MANIFEST.json -Raw | ConvertFrom-Json
          $m.summary | ConvertTo-Json -Depth 8 | Out-File evidence-wave7b-forensic/summary-1366.json
          if($m.summary.state-ne'PASS' -or $m.summary.canonicalScenarios-ne18 -or $m.summary.passedCanonicalScenarios-ne18 -or $m.summary.failedRequiredCanonicalScenarios-ne0 -or $m.summary.failedGates-ne0){throw '1366 admission failure'}
          $importHtml=Get-ChildItem VISUAL_W7B_1366/states -Filter '*documents-r4r21-import-workflow*.html' | Select-Object -First 1
          $importPng=Get-ChildItem VISUAL_W7B_1366/screenshots -Filter '*documents-r4r21-import-workflow*.png' | Select-Object -First 1
          if(-not $importHtml -or -not $importPng){throw '1366 import evidence missing'}
          $html=Get-Content $importHtml.FullName -Raw
          foreach($token in @('Uvoz sa jasnim kontekstom','Poveži sa Radom','Uloga veze','Posledica uvoza','Dokument će biti povezan sa izabranim Radom.','documents-import-native')){if(-not $html.Contains($token)){throw "1366 import evidence invariant missing: $token"}}
          New-Item -ItemType Directory -Force evidence-wave7b-forensic/visual-1366 | Out-Null
          Get-ChildItem VISUAL_W7B_1366/screenshots -Filter '*.png' | Where-Object { $_.Name -match 'documents-r4r21-import-workflow|documents-selected-document|documents-r4r21-selected-managed-state' } | Copy-Item -Destination evidence-wave7b-forensic/visual-1366
          Get-ChildItem VISUAL_W7B_1366/states -Filter '*.html' | Where-Object { $_.Name -match 'documents-r4r21-import-workflow|documents-selected-document|documents-r4r21-selected-managed-state' } | Copy-Item -Destination evidence-wave7b-forensic/visual-1366
      - name: Upload interaction and consequence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-REDESIGN-WAVE7B-DOCUMENTS-INTERACTION-FORENSIC
          path: evidence-wave7b-forensic
          retention-days: 7
