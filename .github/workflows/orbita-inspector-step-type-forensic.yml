name: ORBITA Inspector Step Type Forensic

on:
  push:
    branches: [orbita-redesign]
    paths:
      - 'ci/orbita-inspector-step-type-forensic.cjs'
      - '.github/workflows/orbita-inspector-step-type-forensic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AP_SOURCE_IDENTITY: '8c8e411e679b93e3994b3b64425bb83ef03318eb4316937ca3a28a0be18e5704'

jobs:
  forensic:
    name: Windows Inspector Step Type Map
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbita-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct inspector candidate
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          New-Item -ItemType Directory -Force evidence-inspector-step-types | Out-Null
          ./ci/orbita-redesign-wave6c-reconstruct-c2b.ps1 -EvidenceDir evidence-inspector-step-types
      - name: Resolve authored step contract
        shell: pwsh
        run: |
          node ci/orbita-inspector-step-type-forensic.cjs candidate evidence-inspector-step-types/step-types.json 2>&1 | Tee-Object evidence-inspector-step-types/step-types.log
          if($LASTEXITCODE-ne0){throw 'inspector step type forensic'}
      - name: Upload semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-INSPECTOR-STEP-TYPE-FORENSIC
          path: evidence-inspector-step-types
          retention-days: 7
