name: ORBITA R13AO Public Encrypted Windows Proof

on:
  push:
    branches: [main]
    paths:
      - 'RUN_WINDOWS_PROOF_R13AO.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AO_SOURCE_IDENTITY: '34ca534fe7382fa5df6778d89b312f3e67493cb8740684965fe012b29759cac6'

jobs:
  windows-proof:
    name: Windows x64 R13AO exact patched-source proof
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout encrypted CI repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path evidence | Out-Null

      - name: Verify and unpack public encrypted bridge
        shell: pwsh
        run: |
          $bridgeHash = (Get-FileHash $env:ORBITA_BRIDGE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          "Bridge SHA256=$bridgeHash" | Tee-Object -FilePath evidence/bridge-sha256.txt
          if ($bridgeHash -ne $env:ORBITA_BRIDGE_SHA256) { throw "Bridge SHA mismatch: $bridgeHash" }
          Expand-Archive -LiteralPath $env:ORBITA_BRIDGE_ZIP -DestinationPath bridge -Force
          $encHash = (Get-FileHash $env:ORBITA_ENCRYPTED_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
          "Encrypted payload SHA256=$encHash" | Tee-Object -FilePath evidence/encrypted-payload-sha256.txt
          if ($encHash -ne $env:ORBITA_ENCRYPTED_SHA256) { throw "Encrypted payload SHA mismatch: $encHash" }

      - name: Decrypt authenticated exact R13AN base
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ORBITA_CI_AES256_KEY_B64)) { throw 'Missing required repository secret ORBITA_CI_AES256_KEY_B64' }
          @'
          const fs=require('fs'), crypto=require('crypto');
          const key=Buffer.from(process.env.ORBITA_CI_AES256_KEY_B64,'base64');
          if(key.length!==32) throw new Error('Invalid AES key length');
          const buf=fs.readFileSync(process.env.ORBITA_ENCRYPTED_FILE);
          if(buf.subarray(0,8).toString('ascii')!=='ORBAGCM1') throw new Error('Invalid encrypted payload magic');
          const nonce=buf.subarray(8,20), body=buf.subarray(20), tag=body.subarray(body.length-16), ciphertext=body.subarray(0,body.length-16);
          const decipher=crypto.createDecipheriv('aes-256-gcm',key,nonce); decipher.setAAD(Buffer.from(process.env.ORBITA_AAD,'utf8')); decipher.setAuthTag(tag);
          const plain=Buffer.concat([decipher.update(ciphertext),decipher.final()]);
          const sha=crypto.createHash('sha256').update(plain).digest('hex');
          console.log(`R13AN base SHA256=${sha}`); if(sha!==process.env.ORBITA_BASE_R13AN_SHA256) throw new Error(`Base source SHA mismatch: ${sha}`);
          fs.writeFileSync('candidate.zip',plain);
          '@ | Set-Content decrypt-orbita.cjs -Encoding utf8
          node decrypt-orbita.cjs 2>&1 | Tee-Object -FilePath evidence/decrypt-base.log
          Expand-Archive -LiteralPath candidate.zip -DestinationPath candidate -Force

      - name: Apply deterministic R13AO tooling-only successor patch
        shell: pwsh
        run: |
          node ci/r13ao-tooling-patch.cjs candidate 2>&1 | Tee-Object -FilePath evidence/r13ao-patch.log
          @'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('candidate/.orbita-code-boundary.json','utf8'));
          console.log(`R13AO source identity=${b.sourceDirectoryIdentitySha256}`);
          if(b.developmentSuccessor?.lineage!=='R13AO') throw new Error('R13AO lineage not applied');
          if(b.sourceDirectoryIdentitySha256!==process.env.ORBITA_R13AO_SOURCE_IDENTITY) throw new Error(`R13AO source identity mismatch: ${b.sourceDirectoryIdentitySha256}`);
          '@ | Set-Content verify-r13ao.cjs -Encoding utf8
          node verify-r13ao.cjs 2>&1 | Tee-Object -FilePath evidence/r13ao-source-identity.txt

      - name: Capture runner identity
        shell: pwsh
        run: |
          "runner_os=$env:RUNNER_OS" | Out-File evidence/runner.txt
          "runner_arch=$env:RUNNER_ARCH" | Out-File evidence/runner.txt -Append
          node --version | Out-File evidence/node-version.txt
          npm --version | Out-File evidence/npm-version.txt
          Get-FileHash candidate.zip -Algorithm SHA256 | Format-List | Out-File evidence/r13an-base-zip-sha256.txt

      - name: Install exact dependencies
        working-directory: candidate
        shell: pwsh
        run: npm ci --no-audit --no-fund 2>&1 | Tee-Object -FilePath ../evidence/npm-ci.log

      - name: Typecheck
        working-directory: candidate
        shell: pwsh
        run: npm run typecheck 2>&1 | Tee-Object -FilePath ../evidence/typecheck.log

      - name: Full governance check
        working-directory: candidate
        shell: pwsh
        run: npm run check 2>&1 | Tee-Object -FilePath ../evidence/check.log

      - name: Production build
        working-directory: candidate
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object -FilePath ../evidence/build.log

      - name: Windows package NSIS + portable x64
        working-directory: candidate
        shell: pwsh
        run: npm run package:win 2>&1 | Tee-Object -FilePath ../evidence/package-win.log

      - name: Packaged orbita protocol + preload + SQLite runtime smoke
        working-directory: candidate
        shell: pwsh
        env:
          ORBITA_VISUAL_INSPECTOR: '1'
          ORBITA_VISUAL_INSPECTOR_HIDDEN: '1'
          ORBITA_VISUAL_INSPECTOR_HEADLESS: '1'
          ORBITA_REMOTE_DEBUGGING_PORT: '9447'
          ORBITA_USER_DATA_PATH: '${{ github.workspace }}\candidate\PACKAGED_RUNTIME_PROOF\user-data'
          ORBITA_LOCAL_WORKSPACE_DATABASE_PATH: '${{ github.workspace }}\candidate\PACKAGED_RUNTIME_PROOF\data\orbita-packaged-smoke.sqlite'
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:ORBITA_LOCAL_WORKSPACE_DATABASE_PATH) | Out-Null
          New-Item -ItemType Directory -Force -Path $env:ORBITA_USER_DATA_PATH | Out-Null
          $exe = (Resolve-Path 'release\win-unpacked\Orbita OI Pro.exe').Path
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'evidence\packaged-runtime.stdout.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'evidence\packaged-runtime.stderr.log'
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "pid=$($proc.Id) exe=$exe" | Out-File ../evidence/packaged-runtime-process.txt
          try {
            node ../ci/packaged-runtime-smoke.cjs 2>&1 | Tee-Object -FilePath ../evidence/packaged-runtime-smoke.json
            if ($LASTEXITCODE -ne 0) { throw "Packaged runtime smoke failed with exit $LASTEXITCODE" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Hash release outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path candidate/release) { Get-ChildItem candidate/release -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File evidence/release-sha256.txt }
          else { 'candidate/release not present' | Out-File evidence/release-sha256.txt }

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-R13AO-PUBLIC-ENCRYPTED-WINDOWS-PROOF-EVIDENCE
          path: evidence
          retention-days: 7

      - name: Upload Windows packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-R13AO-WINDOWS-X64-PACKAGES
          path: candidate/release
          retention-days: 7
