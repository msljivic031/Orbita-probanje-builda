name: ORBITA R13AP People Availability Path Diagnostic

on:
  push:
    branches: [main]
    paths: ['RUN_R13AP_PEOPLE_AVAILABILITY_PATH_DIAGNOSTIC.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AP_SOURCE_IDENTITY: '8c8e411e679b93e3994b3b64425bb83ef03318eb4316937ca3a28a0be18e5704'

jobs:
  diagnostic:
    name: Windows R13AP bounded availability path diagnostic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force evidence | Out-Null
      - name: Reconstruct exact R13AP before diagnostic patches
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          $bh=(Get-FileHash $env:ORBITA_BRIDGE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant(); if($bh-ne$env:ORBITA_BRIDGE_SHA256){throw "bridge $bh"}
          Expand-Archive $env:ORBITA_BRIDGE_ZIP bridge -Force
          $eh=(Get-FileHash $env:ORBITA_ENCRYPTED_FILE -Algorithm SHA256).Hash.ToLowerInvariant(); if($eh-ne$env:ORBITA_ENCRYPTED_SHA256){throw "enc $eh"}
          @'
          const fs=require('fs'),crypto=require('crypto');const k=Buffer.from(process.env.ORBITA_CI_AES256_KEY_B64||'','base64');if(k.length!==32)throw Error('secret');const b=fs.readFileSync(process.env.ORBITA_ENCRYPTED_FILE),n=b.subarray(8,20),x=b.subarray(20),tag=x.subarray(x.length-16),ct=x.subarray(0,x.length-16),d=crypto.createDecipheriv('aes-256-gcm',k,n);d.setAAD(Buffer.from(process.env.ORBITA_AAD));d.setAuthTag(tag);const p=Buffer.concat([d.update(ct),d.final()]);const s=crypto.createHash('sha256').update(p).digest('hex');if(s!==process.env.ORBITA_BASE_R13AN_SHA256)throw Error(s);fs.writeFileSync('candidate.zip',p);console.log(s);
          '@ | Set-Content decrypt.cjs -Encoding utf8
          node decrypt.cjs | Tee-Object evidence/r13an-sha.txt
          Expand-Archive candidate.zip candidate -Force
          node ci/r13ao-tooling-patch.cjs candidate | Tee-Object evidence/r13ao-transform.log
          python ci/r13ap-transform.py candidate | Tee-Object evidence/r13ap-transform.log
          $p=Get-Content candidate/.orbita-code-boundary.json -Raw | ConvertFrom-Json
          "identity=$($p.sourceDirectoryIdentitySha256)" | Tee-Object evidence/r13ap-identity-before-diagnostic.txt
          if($p.sourceDirectoryIdentitySha256-ne$env:ORBITA_R13AP_SOURCE_IDENTITY){throw "identity $($p.sourceDirectoryIdentitySha256)"}
      - name: Apply inspector app-root runtime repair
        shell: pwsh
        run: node ci/r13ap-visual-inspector-root-launch-patch.cjs candidate 2>&1 | Tee-Object evidence/app-root-repair.log
      - name: Install dependencies against full canonical scenario set
        working-directory: candidate
        shell: pwsh
        run: npm ci --no-audit --no-fund 2>&1 | Tee-Object ../evidence/npm-ci.log
      - name: Build and pass governance against full canonical scenario set
        working-directory: candidate
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object ../evidence/build.log
      - name: Restrict runtime diagnostic to the two failed People scenarios
        shell: pwsh
        run: node ci/r13ap-target-two-people-scenarios.cjs candidate 2>&1 | Tee-Object evidence/two-scenario-filter.log
      - name: Apply diagnostic-only visible availability tab scenario patch
        shell: pwsh
        run: node ci/r13ap-people-availability-tab-diagnostic-patch.cjs candidate 2>&1 | Tee-Object evidence/availability-tab-diagnostic-patch.log
      - name: Run bounded visual inspector diagnostic
        working-directory: candidate
        shell: pwsh
        run: |
          node tooling/inspector/visual-runtime-inspector.mjs --output "$env:GITHUB_WORKSPACE\PEOPLE_AVAILABILITY_DIAGNOSTIC" --width 1440 --height 900 --max-actions 30 --max-depth 1 --max-states 24 2>&1 | Tee-Object ../evidence/diagnostic-console.log
          $code=$LASTEXITCODE
          if(Test-Path "$env:GITHUB_WORKSPACE\PEOPLE_AVAILABILITY_DIAGNOSTIC\MANIFEST.json"){
            $m=Get-Content "$env:GITHUB_WORKSPACE\PEOPLE_AVAILABILITY_DIAGNOSTIC\MANIFEST.json" -Raw | ConvertFrom-Json
            $m.summary | ConvertTo-Json -Depth 8 | Out-File "$env:GITHUB_WORKSPACE\evidence\diagnostic-summary.json"
          }
          if($code-ne0){Write-Host "Diagnostic inspector exit=$code; evidence will still be uploaded"}
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-R13AP-PEOPLE-AVAILABILITY-PATH-DIAGNOSTIC
          path: |
            PEOPLE_AVAILABILITY_DIAGNOSTIC
            evidence
          retention-days: 3
