name: ORBITA R13AO Sandbox Bundled Preload Feasibility

on:
  push:
    branches: [main]
    paths: ['RUN_SANDBOX_BUNDLED_EXPERIMENT.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AO_SOURCE_IDENTITY: '34ca534fe7382fa5df6778d89b312f3e67493cb8740684965fe012b29759cac6'

jobs:
  sandbox-bundled-preload:
    name: Windows packaged sandbox=true + bundled preload experiment
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force evidence | Out-Null
      - name: Verify, decrypt and reproduce exact R13AO
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          $h=(Get-FileHash $env:ORBITA_BRIDGE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant(); if($h-ne$env:ORBITA_BRIDGE_SHA256){throw "bridge sha $h"}
          Expand-Archive $env:ORBITA_BRIDGE_ZIP bridge -Force
          $e=(Get-FileHash $env:ORBITA_ENCRYPTED_FILE -Algorithm SHA256).Hash.ToLowerInvariant(); if($e-ne$env:ORBITA_ENCRYPTED_SHA256){throw "encrypted sha $e"}
          @'
          const fs=require('fs'),crypto=require('crypto');const key=Buffer.from(process.env.ORBITA_CI_AES256_KEY_B64||'','base64');if(key.length!==32)throw Error('secret');const b=fs.readFileSync(process.env.ORBITA_ENCRYPTED_FILE);if(b.subarray(0,8).toString('ascii')!=='ORBAGCM1')throw Error('magic');const n=b.subarray(8,20),x=b.subarray(20),tag=x.subarray(x.length-16),ct=x.subarray(0,x.length-16),d=crypto.createDecipheriv('aes-256-gcm',key,n);d.setAAD(Buffer.from(process.env.ORBITA_AAD));d.setAuthTag(tag);const p=Buffer.concat([d.update(ct),d.final()]);const s=crypto.createHash('sha256').update(p).digest('hex');if(s!==process.env.ORBITA_BASE_R13AN_SHA256)throw Error(s);fs.writeFileSync('candidate.zip',p);console.log(s);
          '@ | Set-Content decrypt.cjs -Encoding utf8
          node decrypt.cjs | Tee-Object evidence/decrypt.txt
          Expand-Archive candidate.zip candidate -Force
          node ci/r13ao-tooling-patch.cjs candidate | Tee-Object evidence/r13ao.txt
          $b=Get-Content candidate/.orbita-code-boundary.json -Raw | ConvertFrom-Json
          if($b.sourceDirectoryIdentitySha256-ne$env:ORBITA_R13AO_SOURCE_IDENTITY){throw 'R13AO identity mismatch'}
      - name: Install exact dependencies
        working-directory: candidate
        shell: pwsh
        run: npm ci --no-audit --no-fund 2>&1 | Tee-Object ../evidence/npm-ci.log
      - name: Apply sandbox + cjs preload experiment
        shell: pwsh
        run: |
          $w='candidate/src/main/runtime/windowManager.ts';$s=Get-Content $w -Raw;$old='sandbox: false, // Pending separate packaged-preload admission; do not flip without Windows proof.';if(-not$s.Contains($old)){throw 'sandbox source missing'};$s=$s.Replace($old,'sandbox: true, // CI BUNDLED-PRELOAD FEASIBILITY ONLY; not admitted source.');Set-Content $w $s -NoNewline -Encoding utf8
          $r='candidate/src/main/runtime/runtimePaths.ts';$s=Get-Content $r -Raw;if(-not$s.Contains("'preload.js'")){throw 'preload.js runtime path missing'};$s=$s.Replace("'preload.js'","'preload.cjs'");Set-Content $r $s -NoNewline -Encoding utf8
          $q='candidate/tooling/quality/check-packaged-runtime-paths.mjs';$s=Get-Content $q -Raw;$s=$s.Replace("'preload.js'","'preload.cjs'");Set-Content $q $s -NoNewline -Encoding utf8
          Copy-Item ci/bundle-sandbox-preload.mjs candidate/tooling/build/bundle-sandbox-preload.mjs
          Select-String -Path $w -Pattern 'sandbox:' | ForEach-Object {$_.Line.Trim()} | Tee-Object evidence/sandbox-source.txt
          Select-String -Path $r -Pattern 'preloadScriptPath' -Context 0,2 | Out-File evidence/preload-runtime-path.txt
      - name: Build experimental source
        working-directory: candidate
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object ../evidence/build.log
      - name: Bundle preload as one CommonJS file
        working-directory: candidate
        shell: pwsh
        run: |
          node tooling/build/bundle-sandbox-preload.mjs . 2>&1 | Tee-Object ../evidence/preload-bundle.log
          if(-not(Test-Path dist-electron/preload/preload.cjs)){throw 'preload.cjs missing'}
          Get-FileHash dist-electron/preload/preload.cjs -Algorithm SHA256 | Format-List | Out-File ../evidence/preload-cjs-sha256.txt
      - name: Package without rebuilding
        working-directory: candidate
        shell: pwsh
        run: |
          npm run prepare:electron-binary 2>&1 | Tee-Object ../evidence/electron-binary.log
          npx electron-builder --win nsis portable --x64 2>&1 | Tee-Object ../evidence/package-win.log
      - name: Packaged sandbox bundled-preload IPC + SQLite smoke
        working-directory: candidate
        shell: pwsh
        env:
          ORBITA_VISUAL_INSPECTOR: '1'
          ORBITA_VISUAL_INSPECTOR_HIDDEN: '1'
          ORBITA_VISUAL_INSPECTOR_HEADLESS: '1'
          ORBITA_REMOTE_DEBUGGING_PORT: '9449'
          ORBITA_USER_DATA_PATH: '${{ github.workspace }}\candidate\SANDBOX_BUNDLED_PROOF\user-data'
          ORBITA_LOCAL_WORKSPACE_DATABASE_PATH: '${{ github.workspace }}\candidate\SANDBOX_BUNDLED_PROOF\data\orbita-sandbox-bundled.sqlite'
        run: |
          New-Item -ItemType Directory -Force (Split-Path $env:ORBITA_LOCAL_WORKSPACE_DATABASE_PATH) | Out-Null
          New-Item -ItemType Directory -Force $env:ORBITA_USER_DATA_PATH | Out-Null
          $exe=(Resolve-Path 'release\win-unpacked\Orbita OI Pro.exe').Path
          $proc=Start-Process $exe -PassThru -RedirectStandardOutput ../evidence/runtime.stdout.log -RedirectStandardError ../evidence/runtime.stderr.log
          try { node ../ci/packaged-runtime-smoke.cjs 2>&1 | Tee-Object ../evidence/runtime-smoke.json; if($LASTEXITCODE-ne0){throw "smoke exit $LASTEXITCODE"} } finally { if(-not$proc.HasExited){Stop-Process -Id $proc.Id -Force} }
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-R13AO-SANDBOX-BUNDLED-PRELOAD-FEASIBILITY-EVIDENCE
          path: evidence
          retention-days: 7
