name: ORBITA Redesign Wave 6C Printer Environment Probe

on:
  push:
    branches: [orbita-redesign]
    paths:
      - 'ci/orbita-redesign-wave6c-printer-environment-probe.mjs'
      - '.github/workflows/orbita-redesign-wave6c-printer-environment-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AP_SOURCE_IDENTITY: '8c8e411e679b93e3994b3b64425bb83ef03318eb4316937ca3a28a0be18e5704'

jobs:
  probe:
    name: Windows Electron Printer + Platform Dialog
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbita-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct C2b output engine
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: ./ci/orbita-redesign-wave6c-reconstruct-c2b.ps1 -EvidenceDir evidence-w6c-printer-env
      - name: Build candidate
        working-directory: candidate
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object ../evidence-w6c-printer-env/npm-ci.log; if($LASTEXITCODE-ne0){throw 'npm ci'}
          npm run build 2>&1 | Tee-Object ../evidence-w6c-printer-env/build.log; if($LASTEXITCODE-ne0){throw 'build'}
          npx electron --version 2>&1 | Tee-Object ../evidence-w6c-printer-env/electron-runtime.log; if($LASTEXITCODE-ne0){throw 'electron runtime'}
      - name: Probe Electron printers
        shell: pwsh
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          Copy-Item ci/orbita-redesign-wave6c-printer-environment-probe.mjs candidate/.w6c-printer-environment-probe.mjs -Force
          $result=(Join-Path (Resolve-Path evidence-w6c-printer-env).Path 'printer-environment.json')
          Push-Location candidate
          Copy-Item package.json .w6c-package-backup.json -Force
          @'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.main='.w6c-printer-environment-probe.mjs';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          '@ | node
          $env:ORBITA_W6C_PRINTER_PROBE_RESULT=$result
          Remove-Item Env:ORBITA_W6C_PRODUCT_PRINT -ErrorAction SilentlyContinue
          npx electron . 2>&1 | Tee-Object ../evidence-w6c-printer-env/printer-probe-console.log
          $code=$LASTEXITCODE
          Copy-Item .w6c-package-backup.json package.json -Force
          Remove-Item .w6c-package-backup.json -Force
          Pop-Location
          if($code-ne0){throw "printer environment probe $code"}
          $probe=Get-Content $result -Raw | ConvertFrom-Json
          if($probe.state-ne'PASS' -or $probe.printerCount-lt1){throw 'no Electron printer target'}
      - name: Bootstrap canonical inspector SQLite truth
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\ci\orbita-visual-inspector-infra-retry.ps1" -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" -Output "$env:GITHUB_WORKSPACE\VISUAL_REDESIGN_W6C_PRINT_BOOTSTRAP" -Width 1440 -Height 900 -LogFile "$env:GITHUB_WORKSPACE\evidence-w6c-printer-env\inspector-bootstrap-console.log"
          if($LASTEXITCODE-ne0){throw "inspector bootstrap $LASTEXITCODE"}
          $m=Get-Content VISUAL_REDESIGN_W6C_PRINT_BOOTSTRAP/MANIFEST.json -Raw | ConvertFrom-Json
          $m.summary | ConvertTo-Json -Depth 8 | Out-File evidence-w6c-printer-env/inspector-bootstrap-summary.json
          if($m.summary.state-ne'PASS' -or $m.summary.passedCanonicalScenarios-ne18 -or $m.summary.failedGates-ne0){throw 'inspector bootstrap admission failure'}
          if(-not(Test-Path VISUAL_REDESIGN_W6C_PRINT_BOOTSTRAP/runtime-evidence/orbita-visual-inspector.sqlite)){throw 'runtime SQLite missing'}
      - name: Exercise real product Print dialog and controlled cancel
        shell: pwsh
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class W6CWin32 {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          $evidence=(Resolve-Path evidence-w6c-printer-env).Path
          $result=Join-Path $evidence 'platform-print-result.json'
          $dialogJson=Join-Path $evidence 'platform-print-dialog.json'
          $dialogPng=Join-Path $evidence 'platform-print-dialog.png'
          $console=Join-Path $evidence 'platform-print-console.log'
          $runtimeDb=(Resolve-Path VISUAL_REDESIGN_W6C_PRINT_BOOTSTRAP/runtime-evidence/orbita-visual-inspector.sqlite).Path
          Copy-Item ci/orbita-redesign-wave6c-printer-environment-probe.mjs candidate/.w6c-printer-environment-probe.mjs -Force
          Push-Location candidate
          Copy-Item package.json .w6c-package-backup.json -Force
          @'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.main='.w6c-printer-environment-probe.mjs';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          '@ | node
          $env:ORBITA_RUNTIME_SCREENSHOT_DATABASE_PATH=$runtimeDb
          $env:ORBITA_W6C_PRINTER_PROBE_RESULT=$result
          $env:ORBITA_W6C_PRODUCT_PRINT='1'
          $cmd="npx electron . 1> `"$console`" 2>&1"
          $proc=Start-Process -FilePath cmd.exe -ArgumentList '/d','/s','/c',$cmd -PassThru
          $seen=$false;$title='';$class='';$handle=[IntPtr]::Zero
          $deadline=(Get-Date).AddSeconds(25)
          while((Get-Date)-lt$deadline -and -not$seen){
            Start-Sleep -Milliseconds 500
            $h=[W6CWin32]::GetForegroundWindow();if($h-eq[IntPtr]::Zero){continue}
            $t=New-Object System.Text.StringBuilder 512;$c=New-Object System.Text.StringBuilder 128
            [void][W6CWin32]::GetWindowText($h,$t,$t.Capacity);[void][W6CWin32]::GetClassName($h,$c,$c.Capacity)
            $candidateTitle=$t.ToString();$candidateClass=$c.ToString()
            if($candidateTitle -match '(?i)print|štamp|stamp'){ $seen=$true;$title=$candidateTitle;$class=$candidateClass;$handle=$h }
          }
          $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics=[System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bmp.Save($dialogPng,[System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose();$bmp.Dispose()
          @{detected=$seen;title=$title;class=$class;width=$bounds.Width;height=$bounds.Height;capturedAt=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Out-File $dialogJson
          if($seen){[void][W6CWin32]::SetForegroundWindow($handle);Start-Sleep -Milliseconds 250;[System.Windows.Forms.SendKeys]::SendWait('{ESC}')}
          if(-not$proc.WaitForExit(30000)){[System.Windows.Forms.SendKeys]::SendWait('{ESC}');Start-Sleep 2}
          if(-not$proc.HasExited){$proc.Kill();throw 'product print process did not exit after controlled cancel'}
          $code=$proc.ExitCode
          Copy-Item .w6c-package-backup.json package.json -Force
          Remove-Item .w6c-package-backup.json -Force
          Pop-Location
          if(-not$seen){throw 'native Print dialog was not detected'}
          if($code-ne0){throw "product print runtime $code"}
          $print=Get-Content $result -Raw | ConvertFrom-Json
          if($print.state-ne'PASS_CALLBACK'){throw 'product print callback proof failed'}
      - name: Upload printer and platform dialog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-REDESIGN-WAVE6C-PLATFORM-PRINT-EVIDENCE
          path: |
            evidence-w6c-printer-env
          retention-days: 7
