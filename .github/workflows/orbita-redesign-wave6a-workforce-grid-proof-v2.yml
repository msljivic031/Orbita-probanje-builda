name: ORBITA Redesign Wave 6A Workforce Grid Proof V2

on:
  push:
    branches: [orbita-redesign]
    paths: ['RUN_REDESIGN_WAVE6A_WORKFORCE_GRID_V2.txt']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ORBITA_BRIDGE_ZIP: 'ORBITA_R13AN_PUBLIC_ENCRYPTED_CI_REPO_READY_R1_2026_08_12.zip'
  ORBITA_BRIDGE_SHA256: 'dfe1f58a7df5c79c2d841496fd364418f98a91ed2fd6112fc0f5e0ab9c43731e'
  ORBITA_BASE_R13AN_SHA256: '140846e9be04d3da222996fed9701771c4cb1be1c8395e766512ece153ba399a'
  ORBITA_ENCRYPTED_SHA256: '827742a1633bd71dae1d2e1fb3dc77a95835a279a660016c8844d305341b1687'
  ORBITA_AAD: 'ORBITA-R13AN-PUBLIC-CI-R1'
  ORBITA_ENCRYPTED_FILE: 'bridge/ORBITA2_R14_R13AN_NATIVE_CONTENT_SIGNATURE_HARDENING_NON_PROMOTED_CANDIDATE_R2_2026_08_12.zip.aesgcm'
  ORBITA_R13AP_SOURCE_IDENTITY: '8c8e411e679b93e3994b3b64425bb83ef03318eb4316937ca3a28a0be18e5704'

jobs:
  proof:
    name: Windows Workforce Wave 6A V2
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orbita-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force evidence | Out-Null
      - name: Reconstruct exact R13AP parent
        shell: pwsh
        env:
          ORBITA_CI_AES256_KEY_B64: ${{ secrets.ORBITA_CI_AES256_KEY_B64 }}
        run: |
          $bh=(Get-FileHash $env:ORBITA_BRIDGE_ZIP -Algorithm SHA256).Hash.ToLowerInvariant(); if($bh-ne$env:ORBITA_BRIDGE_SHA256){throw "bridge $bh"}
          Expand-Archive $env:ORBITA_BRIDGE_ZIP bridge -Force
          $eh=(Get-FileHash $env:ORBITA_ENCRYPTED_FILE -Algorithm SHA256).Hash.ToLowerInvariant(); if($eh-ne$env:ORBITA_ENCRYPTED_SHA256){throw "enc $eh"}
          @'
          const fs=require('fs'),crypto=require('crypto');const k=Buffer.from(process.env.ORBITA_CI_AES256_KEY_B64||'','base64');if(k.length!==32)throw Error('secret');const b=fs.readFileSync(process.env.ORBITA_ENCRYPTED_FILE),n=b.subarray(8,20),x=b.subarray(20),tag=x.subarray(x.length-16),ct=x.subarray(0,x.length-16),d=crypto.createDecipheriv('aes-256-gcm',k,n);d.setAAD(Buffer.from(process.env.ORBITA_AAD));d.setAuthTag(tag);const p=Buffer.concat([d.update(ct),d.final()]);const s=crypto.createHash('sha256').update(p).digest('hex');if(s!==process.env.ORBITA_BASE_R13AN_SHA256)throw Error(s);fs.writeFileSync('candidate.zip',p);console.log(s);
          '@ | Set-Content decrypt.cjs -Encoding utf8
          node decrypt.cjs | Tee-Object evidence/r13an-sha.txt
          if($LASTEXITCODE-ne0){throw "decrypt $LASTEXITCODE"}
          Expand-Archive candidate.zip candidate -Force
          node ci/r13ao-tooling-patch.cjs candidate 2>&1 | Tee-Object evidence/r13ao.log; if($LASTEXITCODE-ne0){throw "r13ao $LASTEXITCODE"}
          python ci/r13ap-transform.py candidate 2>&1 | Tee-Object evidence/r13ap.log; if($LASTEXITCODE-ne0){throw "r13ap $LASTEXITCODE"}
          $p=Get-Content candidate/.orbita-code-boundary.json -Raw | ConvertFrom-Json
          if($p.sourceDirectoryIdentitySha256-ne$env:ORBITA_R13AP_SOURCE_IDENTITY){throw "identity $($p.sourceDirectoryIdentitySha256)"}
          "parent=$($p.sourceDirectoryIdentitySha256)" | Tee-Object evidence/parent-identity.txt
      - name: Apply proven redesign through Wave 5
        shell: pwsh
        run: |
          node ci/r13ar-people-availability-live-entry-repair.cjs candidate 2>&1 | Tee-Object evidence/r13ar.log; if($LASTEXITCODE-ne0){throw "r13ar $LASTEXITCODE"}
          node ci/r13aq-people-availability-scenario-owner-repair.cjs candidate 2>&1 | Tee-Object evidence/r13aq.log; if($LASTEXITCODE-ne0){throw "r13aq $LASTEXITCODE"}
          node ci/r13ap-visual-inspector-root-launch-patch.cjs candidate 2>&1 | Tee-Object evidence/root.log; if($LASTEXITCODE-ne0){throw "root $LASTEXITCODE"}
          node ci/orbita-visual-inspector-viewport-proof-patch.cjs candidate 2>&1 | Tee-Object evidence/viewport-proof-patch.log; if($LASTEXITCODE-ne0){throw "viewport $LASTEXITCODE"}
          node ci/orbita-redesign-wave1-transform.cjs candidate 2>&1 | Tee-Object evidence/w1.log; if($LASTEXITCODE-ne0){throw "w1 $LASTEXITCODE"}
          node ci/orbita-redesign-wave2-run.cjs candidate 2>&1 | Tee-Object evidence/w2.log; if($LASTEXITCODE-ne0){throw "w2 $LASTEXITCODE"}
          node ci/orbita-redesign-wave3-run.cjs candidate 2>&1 | Tee-Object evidence/w3.log; if($LASTEXITCODE-ne0){throw "w3 $LASTEXITCODE"}
          node ci/orbita-redesign-wave4-people-transform.cjs candidate 2>&1 | Tee-Object evidence/w4.log; if($LASTEXITCODE-ne0){throw "w4 $LASTEXITCODE"}
          node ci/orbita-redesign-wave4-people-scenario-proof.cjs candidate 2>&1 | Tee-Object evidence/w4-scenario.log; if($LASTEXITCODE-ne0){throw "w4 scenario $LASTEXITCODE"}
          node ci/orbita-redesign-wave5-person-history-transform.cjs candidate 2>&1 | Tee-Object evidence/w5.log; if($LASTEXITCODE-ne0){throw "w5 $LASTEXITCODE"}
          node ci/orbita-redesign-wave5-person-history-scenario-proof.cjs candidate 2>&1 | Tee-Object evidence/w5-scenario.log; if($LASTEXITCODE-ne0){throw "w5 scenario $LASTEXITCODE"}
      - name: Apply repaired Wave 6A Workforce monthly projection
        shell: pwsh
        run: |
          node --check ci/orbita-redesign-wave6a-workforce-grid-transform-v2.cjs
          if($LASTEXITCODE-ne0){throw "w6a v2 wrapper syntax $LASTEXITCODE"}
          node ci/orbita-redesign-wave6a-workforce-grid-transform-v2.cjs candidate 2>&1 | Tee-Object evidence/w6a.log
          if($LASTEXITCODE-ne0){throw "w6a v2 transform $LASTEXITCODE"}
          node ci/orbita-redesign-wave6a-workforce-scenario-proof.cjs candidate 2>&1 | Tee-Object evidence/w6a-scenario.log
          if($LASTEXITCODE-ne0){throw "w6a scenario $LASTEXITCODE"}
      - name: Install dependencies
        working-directory: candidate
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund 2>&1 | Tee-Object ../evidence/npm-ci.log
          if($LASTEXITCODE-ne0){throw "npm ci $LASTEXITCODE"}
      - name: Typecheck and ownership gates
        working-directory: candidate
        shell: pwsh
        run: |
          npm run typecheck 2>&1 | Tee-Object ../evidence/typecheck.log; if($LASTEXITCODE-ne0){throw "typecheck $LASTEXITCODE"}
          npm run check:inspector-schema 2>&1 | Tee-Object ../evidence/schema.log; if($LASTEXITCODE-ne0){throw "schema $LASTEXITCODE"}
          npm run check:action-coverage 2>&1 | Tee-Object ../evidence/action-coverage.log; if($LASTEXITCODE-ne0){throw "action coverage $LASTEXITCODE"}
      - name: Build Wave 6A candidate
        working-directory: candidate
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object ../evidence/build.log
          if($LASTEXITCODE-ne0){throw "build $LASTEXITCODE"}
      - name: Full canonical visual inspector 1440x900
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\ci\orbita-visual-inspector-infra-retry.ps1" -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" -Output "$env:GITHUB_WORKSPACE\VISUAL_REDESIGN_W6A_1440" -Width 1440 -Height 900 -LogFile "$env:GITHUB_WORKSPACE\evidence\visual-1440-console.log"
          if($LASTEXITCODE-ne0){throw "visual 1440 $LASTEXITCODE"}
      - name: Assert Wave 6A admission 1440
        shell: pwsh
        run: |
          $m=Get-Content VISUAL_REDESIGN_W6A_1440/MANIFEST.json -Raw | ConvertFrom-Json
          $m.summary | ConvertTo-Json -Depth 8 | Out-File evidence/visual-1440-summary.json
          if($m.summary.state-ne'PASS' -or $m.summary.canonicalScenarios-ne18 -or $m.summary.passedCanonicalScenarios-ne18 -or $m.summary.failedRequiredCanonicalScenarios-ne0 -or $m.summary.failedGates-ne0){throw '1440 admission failure'}
          $h=@(Get-ChildItem VISUAL_REDESIGN_W6A_1440/screenshots -Filter '*people-workforce-*.png'); if($h.Count-lt2){throw "Workforce captures missing 1440: $($h.Count)"}
      - name: Full canonical visual inspector 1366x768
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\ci\orbita-visual-inspector-infra-retry.ps1" -CandidateRoot "$env:GITHUB_WORKSPACE\candidate" -Output "$env:GITHUB_WORKSPACE\VISUAL_REDESIGN_W6A_1366" -Width 1366 -Height 768 -LogFile "$env:GITHUB_WORKSPACE\evidence\visual-1366-console.log"
          if($LASTEXITCODE-ne0){throw "visual 1366 $LASTEXITCODE"}
      - name: Assert Wave 6A admission 1366
        shell: pwsh
        run: |
          $m=Get-Content VISUAL_REDESIGN_W6A_1366/MANIFEST.json -Raw | ConvertFrom-Json
          $m.summary | ConvertTo-Json -Depth 8 | Out-File evidence/visual-1366-summary.json
          if($m.summary.state-ne'PASS' -or $m.summary.canonicalScenarios-ne18 -or $m.summary.passedCanonicalScenarios-ne18 -or $m.summary.failedRequiredCanonicalScenarios-ne0 -or $m.summary.failedGates-ne0){throw '1366 admission failure'}
          $h=@(Get-ChildItem VISUAL_REDESIGN_W6A_1366/screenshots -Filter '*people-workforce-*.png'); if($h.Count-lt2){throw "Workforce captures missing 1366: $($h.Count)"}
      - name: Assert physical Workforce viewport evidence
        shell: pwsh
        run: |
          node ci/orbita-redesign-wave6a-viewport-evidence-gate.cjs "$env:GITHUB_WORKSPACE" 2>&1 | Tee-Object evidence/viewport-evidence-gate.log
          if($LASTEXITCODE-ne0){throw "viewport evidence gate $LASTEXITCODE"}
      - name: Upload Wave 6A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBITA-REDESIGN-WAVE6A-WORKFORCE-GRID-EVIDENCE-V2
          path: |
            VISUAL_REDESIGN_W6A_1440
            VISUAL_REDESIGN_W6A_1366
            evidence
          retention-days: 7
